    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'JetBrains Mono', monospace;
    background-color: #000;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

#particles-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

.container {
    position: relative;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
}

.content-wrapper {
    display: flex;
    gap: 30px;
    align-items: stretch;
    max-width: 900px;
    width: 100%;
}

.main-content {
    flex: 1;
    max-width: 480px;
    background-color: transparent;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 30px;
    animation: fadeIn 0.7s ease-out;
    min-height: 600px;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
}

.main-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 16px;
    border: 1px solid transparent;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: -1;
}

@media (min-width: 1025px) {
    .main-content {
        backdrop-filter: blur(6px);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
    }
    
    .main-content:hover {
        box-shadow: 0 0 60px rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
    }
}

@media (max-width: 1024px) {
    .content-wrapper {
        flex-direction: column;
        align-items: center;
        max-width: 480px;
    }
    
    .main-content {
        min-height: auto;
        padding: 40px 20px;
        width: 100%;
    }
}

.avatar-section {
    position: relative;
}

.avatar-link {
    display: block;
    text-decoration: none;
    cursor: pointer;
}

.avatar-wrapper {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid white;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    transition: all 0.5s ease;
    position: relative;
}

.avatar-wrapper::after {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff, #5f27cd);
    background-size: 400% 400%;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: gradientRotate 3s linear infinite;
}

@keyframes gradientRotate {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.avatar-link:hover .avatar-wrapper::after {
    opacity: 1;
}

@media (min-width: 640px) {
    .avatar-wrapper {
        width: 112px;
        height: 112px;
    }
}

.avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
    position: relative;
    z-index: 1;
}

.avatar-link:hover .avatar-wrapper {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
    border-color: white;
}

.avatar-link:hover .avatar {
    transform: rotate(-5deg);
}

.avatar-hover-text {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-family: 'VT323', monospace;
    font-size: 10px;
    color: white;
    letter-spacing: 2px;

    padding: 2px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}

.avatar-link:hover .avatar-hover-text {
    opacity: 1;
    transform: translateX(-50%) translateY(-5px);
}

.info-section {

}

.nickname {

@media (min-width: 640px) {

.description {

    <script>
/* =========================
   CANVAS SNOW + ENHANCED EFFECTS
   ========================= */

const canvas = document.getElementById("particles-canvas");
const ctx = canvas.getContext("2d");
const windIndicator = document.querySelector('.wind-indicator');

let w, h;
const SNOW_COUNT = 120;
const LINK_DISTANCE = 120;
const MOUSE_DISTANCE = 140;
let snow = [];
let wind = { x: 0, y: 0 };
let lastWindChange = Date.now();

const mouse = { x: null, y: null };

const parallaxLayer = document.querySelector('.parallax-layer');
let mouseX = 0, mouseY = 0;

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX / w;
    mouseY = e.clientY / h;
    
    if (parallaxLayer) {
        const moveX = mouseX * 20 - 10;
        const moveY = mouseY * 20 - 10;
        parallaxLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }
});

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener("mouseleave", () => {
    mouse.x = mouse.y = null;
});

class Snow {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.r = Math.random() * 2 + 0.8;
        this.baseSpeed = Math.random() * 0.8 + 0.4;
        this.sy = this.baseSpeed;
        this.sx = Math.random() * 0.4 - 0.2;
        this.a = Math.random() * 0.5 + 0.4;
        this.oscillation = Math.random() * Math.PI * 2;
        this.oscillationSpeed = Math.random() * 0.02 + 0.01;
    }

    update(audioIntensity = 0) {
        this.x += wind.x;
        this.y += wind.y;
        
        this.sy = this.baseSpeed * (1 + audioIntensity * 0.3);
        
        this.oscillation += this.oscillationSpeed;
        this.x += Math.sin(this.oscillation) * 0.1;
        
        this.y += this.sy;
        this.x += this.sx;
        
        if (this.y > h) {
            this.y = -10;
            this.x = Math.random() * w;
        }
        if (this.x > w) this.x = -10;
        if (this.x < -10) this.x = w;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${this.a})`;
        ctx.fill();
    }
}

function initSnow() {
    snow = [];
    for (let i = 0; i < SNOW_COUNT; i++) {
        snow.push(new Snow());
    }
}

function drawSnowLinks(audioIntensity = 0) {
    ctx.globalAlpha = 0.3 + audioIntensity * 0.3;
    for (let i = 0; i < snow.length; i++) {
        for (let j = i + 1; j < snow.length; j++) {
            const dx = snow[i].x - snow[j].x;
            const dy = snow[i].y - snow[j].y;
            const d = Math.sqrt(dx * dx + dy * dy);

            if (d < LINK_DISTANCE) {
                const alpha = (1 - d / LINK_DISTANCE) * (0.3 + audioIntensity * 0.2);
                ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                ctx.lineWidth = 0.4 + audioIntensity * 0.3;
                ctx.beginPath();
                ctx.moveTo(snow[i].x, snow[i].y);
                ctx.lineTo(snow[j].x, snow[j].y);
                ctx.stroke();
            }
        }
    }
    ctx.globalAlpha = 1;
}

function drawMouseLinks() {
    if (!mouse.x) return;

    ctx.globalAlpha = 0.3;
    snow.forEach(p => {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const d = Math.sqrt(dx * dx + dy * dy);

        if (d < MOUSE_DISTANCE) {
            ctx.strokeStyle = `rgba(255,255,255,${1 - d / MOUSE_DISTANCE})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(mouse.x, mouse.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
    });
    ctx.globalAlpha = 1;
}

function updateWind() {
    const now = Date.now();
    if (now - lastWindChange > 10000) {
        lastWindChange = now;
        wind.x = (Math.random() - 0.5) * 0.5;
        wind.y = (Math.random() - 0.5) * 0.2;
        
        const windStrength = Math.sqrt(wind.x * wind.x + wind.y * wind.y);
        let windText = "CALM";
        if (windStrength > 0.3) windText = "STRONG";
        else if (windStrength > 0.15) windText = "MODERATE";
        else if (windStrength > 0.05) windText = "LIGHT";
        
        windIndicator.textContent = `WIND: ${windText}`;
        windIndicator.style.opacity = '1';
        setTimeout(() => {
            windIndicator.style.opacity = '0';
        }, 2000);
    }
}

function createSpark() {
    if (Math.random() < 0.01) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        spark.style.left = Math.random() * w + 'px';
        spark.style.top = Math.random() * h + 'px';
        document.body.appendChild(spark);
        
        spark.animate([
            { opacity: 0, transform: 'scale(0)' },
            { opacity: 1, transform: 'scale(1)' },
            { opacity: 0, transform: 'scale(0)' }
        ], {
            duration: 1000 + Math.random() * 1000,
            easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
        });
        
        setTimeout(() => spark.remove(), 2000);
    }
}

let audioIntensity = 0;
let lastAudioUpdate = 0;

function animate() {
    ctx.clearRect(0, 0, w, h);
    
    updateWind();
    createSpark();
    
    snow.forEach(p => {
        p.update(audioIntensity);
        p.draw();
    });

    drawSnowLinks(audioIntensity);
    drawMouseLinks();
    
    const now = Date.now();
    if (now - lastAudioUpdate > 100) {
        audioIntensity *= 0.9;
    }

    requestAnimationFrame(animate);
}

initSnow();
animate();

/* =========================
   AUDIO PLAYER WITH REACTIVITY
   ========================= */

const isDesktop = window.innerWidth > 1024;

if (isDesktop) {
    const audio = document.getElementById("bg-music");
    const playBtn = document.getElementById("bioPlayBtn");
    const progress = document.getElementById("bioProgress");
    const bar = document.getElementById("bioProgressBar");
    const cur = document.getElementById("bioCurrent");
    const dur = document.getElementById("bioDuration");
    const player = document.getElementById("bioPlayer");
    const trackElement = document.querySelector('.bio-player-track');

    let isPlaying = true; // Start with playing
    let audioContext, analyser, source, dataArray;
    let beatTimer = 0;
    let lastBeatTime = 0;

    audio.volume = 0.5;
    audio.loop = true;

    function fmt(t) {
        if (isNaN(t) || !isFinite(t)) return "00:00";
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
            const p = (audio.currentTime / audio.duration) * 100;
            bar.style.width = p + "%";
            cur.textContent = fmt(audio.currentTime);
        }
    }

    function initAudioAnalysis() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            updateAudioAnalysis();
        } catch (e) {
            console.log("Audio analysis not supported:", e);
        }
    }

    function updateAudioAnalysis() {
        if (!analyser || !isPlaying) {
            requestAnimationFrame(updateAudioAnalysis);
            return;
        }
        
        analyser.getByteFrequencyData(dataArray);
        
        let sum = 0;
        for (let i = 0; i < 32; i++) {
            sum += dataArray[i];
        }
        const avgIntensity = sum / (32 * 256);
        
        audioIntensity = avgIntensity;
        lastAudioUpdate = Date.now();
        
        const now = Date.now();
        if (avgIntensity > 0.3 && now - lastBeatTime > 200) {
            if (beatTimer > 0.5) {
                lastBeatTime = now;
                triggerBeatEffect();
            }
        }
        
        if (player) {
            if (avgIntensity > 0.2) {
                player.classList.add('audio-active');
                bar.classList.add('audio-active');
                
                if (avgIntensity > 0.4) {
                    player.classList.add('audio-pulse');
                    setTimeout(() => {
                        player.classList.remove('audio-pulse');
                    }, 200);
                }
            } else {
                player.classList.remove('audio-active');
                bar.classList.remove('audio-active');
            }
        }
        
        beatTimer = avgIntensity;
        requestAnimationFrame(updateAudioAnalysis);
    }

    function triggerBeatEffect() {
        if (trackElement) {
            trackElement.animate([
                { transform: 'scale(1)', textShadow: '0 0 10px rgba(255,255,255,0.7)' },
                { transform: 'scale(1.05)', textShadow: '0 0 20px rgba(255,255,255,1)' },
                { transform: 'scale(1)', textShadow: '0 0 10px rgba(255,255,255,0.7)' }
            ], {
                duration: 200,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
            });
        }
    }

    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i> PLAY';
            player.classList.remove('audio-active');
        } else {
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i> PAUSE';
                
                if (!audioContext) {
                    initAudioAnalysis();
                }
            }).catch(error => {
                console.log("Play error:", error);
            });
        }
    }

    if (playBtn) {
        playBtn.addEventListener("click", togglePlay);
    }

    if (progress) {
        progress.addEventListener("click", e => {
            if (audio.duration && !isNaN(audio.duration)) {
                const x = e.offsetX / progress.clientWidth;
                audio.currentTime = x * audio.duration;
            }
        });
    }

    audio.addEventListener("loadedmetadata", () => {
        console.log("Audio loaded, duration:", fmt(audio.duration));
        if (dur) {
            dur.textContent = fmt(audio.duration);
        }
    });

    audio.addEventListener("timeupdate", updateProgress);

    audio.addEventListener("error", (e) => {
        console.error("Audio error:", e);
        console.error("Error code:", audio.error?.code);
        console.error("Error message:", audio.error?.message);
        
        if (trackElement) {
            trackElement.textContent = "Audio error - trying alternatives...";
        }
    });

    // Auto-play on load with user interaction fallback
    window.addEventListener('load', function() {
        console.log("Desktop: Loading audio...");
        
        // Try to play automatically
        const playPromise = audio.play();
        
        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log("Audio autoplay successful");
                initAudioAnalysis();
            }).catch(error => {
                console.log("Autoplay prevented, waiting for user interaction:", error);
                
                // Add interaction handler
                const unlockAudio = () => {
                    audio.play().then(() => {
                        console.log("Audio started after user interaction");
                        initAudioAnalysis();
                        document.removeEventListener('click', unlockAudio);
                    });
                };
                
                document.addEventListener('click', unlockAudio);
            });
        }
    });
} else {
    console.log("Mobile/Tablet: Audio player disabled");
    
    const audioElement = document.getElementById('bg-music');
    const playerElement = document.getElementById('bioPlayer');
    
    if (audioElement) audioElement.remove();
    if (playerElement) playerElement.remove();
}

window.addEventListener('resize', function() {
    const isNowDesktop = window.innerWidth > 1024;
    
    if (!isNowDesktop) {
        const audioElement = document.getElementById('bg-music');
        const playerElement = document.getElementById('bioPlayer');
        
        if (audioElement) audioElement.remove();
        if (playerElement) playerElement.remove();
    }
});

window.addEventListener('load', function() {
    console.log("Page loaded - Device type:", window.innerWidth > 1024 ? "Desktop" : "Mobile/Tablet");
});

    </script>
